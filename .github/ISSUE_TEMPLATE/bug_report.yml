name: Reporte de error / Bug report
description: Algo no funciona como debería / Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre / What happens
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo / Steps to reproduce
      description: Comandos exactos y variables REPO_MAINTENANCE_* usadas / Exact commands and REPO_MAINTENANCE_* variables used.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno / Environment
      description: Sistema operativo, versión de Bash, Git y npm / OS, Bash, Git and npm versions.
    validations:
      required: true
  - type: checkboxes
    id: privacidad
    attributes:
      label: Privacidad / Privacy
      options:
        - label: No incluí credenciales, rutas privadas ni salidas con datos sensibles / I did not include credentials, private paths or output with sensitive data
          required: true
